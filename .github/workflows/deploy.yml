name: Publicar imagen en Docker Hub

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install bandit

      - name: Escanear seguridad
        run: |
          bandit -r . --exclude ./.venv,./tempdir

      - name: Ejecutar pruebas
        run: |
          pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERS_USER_NAME }}
          password: ${{ secrets.DOCKERS_PASSWORD }}

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anderson2103/mi-api:latest

      - name: Diagnosticar conexion SSH
        run: |
          echo "Probando SERVER_HOST en puerto 22..."
          nc -vz -w 10 "${{ secrets.SERVER_HOST }}" 22

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'anderson2103/mi-api:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Publicar imagen en Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: anderson2103/mi-api:latest

      - name: Desplegar en el servidor cloud
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            cd ~/docker-flask
            docker compose pull backend
            docker compose up -d backend